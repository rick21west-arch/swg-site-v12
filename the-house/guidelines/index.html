<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submission Guidelines — Southern Writers Guild</title>
  <link rel="stylesheet" href="../../css/swg.css">
</head>
<body>

  <nav class="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo-link"><img src="../../assets/images/swg-logo.png" alt="Southern Writers Guild" class="nav-logo"></a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <ul class="nav-links">
        <li><a href="/the-porch/">The Porch</a></li>
        <li><a href="/the-work/">The Work</a></li>
        <li><a href="/events/">Events</a></li>
        <li><a href="/the-house/" class="active">The House</a></li>
        <li><a href="/writers/">Writers</a></li>
        
        <li class="nav-join"><a href="/join/">Join</a></li>
      </ul>
    </div>
  </nav>

  <section style="padding:var(--sp-xl) 0 var(--sp-lg);">
    <div class="container--narrow prose">

      <span class="section-eyebrow">How to Submit</span>
      <h1>We read everything.<br>We publish selectively.</h1>

      <div id="guidelines-body">
        <p style="color:var(--text-faint);font-size:0.85rem;">Loading…</p>
      </div>

    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-text">© 2026 Southern Writers Guild</span>
      <img src="/assets/images/icon-peacock.png" alt="Jean-Paul, the Guild's peacock" class="footer-peacock">
    </div>
  </footer>

  <script type="module">
    import { fetchHouseContent, renderPortableText } from '../../js/sanity.js'

    // Same mechanism as every other preview-aware page — see
    // the-porch/story/index.html for the full explanation.
    function isPreviewing() {
      return document.cookie.split('; ').some(c => c.indexOf('swg_preview_active=') === 0)
    }

    function fetchHouse() {
      if (!isPreviewing()) return fetchHouseContent()
      return fetch('/api/preview-singleton?type=houseContent')
        .then(res => {
          if (!res.ok) throw new Error('Preview fetch failed')
          return res.json()
        })
        .then(data => data.result)
        .catch(() => fetchHouseContent())
    }

    const bodyEl = document.getElementById('guidelines-body')

    fetchHouse()
      .then(house => {
        if (!house || !house.submissionGuidelines || !house.submissionGuidelines.length) {
          throw new Error('No guidelines content')
        }
        bodyEl.innerHTML = renderPortableText(house.submissionGuidelines)
      })
      .catch(() => {
        bodyEl.innerHTML = '<p style="color:var(--text-faint);font-size:0.85rem;">Content unavailable.</p>'
      })
  </script>

  <script src="../../js/nav.js"></script>
</body>
</html>
