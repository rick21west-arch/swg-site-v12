<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events — Southern Writers Guild</title>
  <meta name="description" content="Readings, fairs, and gatherings from the Southern Writers Guild.">
  <link rel="stylesheet" href="../css/swg.css">
  <style>
    .events-header {
      padding: 48px 60px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .events-label {
      font-size: 14px;
      letter-spacing: 0.22em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .events-tagline {
      font-family: var(--serif, 'Cormorant Garamond', Georgia, serif);
      font-size: 15px;
      font-style: italic;
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .events-divider { border: none; border-top: 1px solid var(--border); margin: 0; }
    .events-grid-wrap { padding: 44px 60px 0; }
    #events-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .events-footer {
      padding: 40px 60px 56px;
      display: flex;
      justify-content: flex-end;
    }
    .archive-link {
      font-size: 14px;
      color: var(--accent);
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s;
      white-space: nowrap;
    }
    .archive-link:hover { color: var(--accent-light); }
    @media (max-width: 768px) {
      .events-header { padding: 36px 24px 12px; flex-direction: column; align-items: flex-start; gap: 16px; }
      .events-grid-wrap { padding: 32px 24px 0; }
      #events-grid { grid-template-columns: 1fr; }
      .events-footer { padding: 32px 24px 40px; }
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo-link">
        <img src="../assets/images/swg-logo.png" alt="Southern Writers Guild" class="nav-logo">
      </a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <ul class="nav-links">
        <li><a href="/the-porch/">The Porch</a></li>
        <li><a href="/the-work/">The Work</a></li>
        <li><a href="/events/" class="active">Events</a></li>
        <li><a href="/the-house/">The House</a></li>
        <li><a href="/writers/">Writers</a></li>
        <li class="nav-join"><a href="/join/">Join</a></li>
      </ul>
    </div>
  </nav>

  <div class="events-header">
    <div>
      <p class="events-label">Events</p>
      <p class="events-tagline">Where the Guild shows up in person.</p>
    </div>
  </div>

  <hr class="events-divider">

  <div class="events-grid-wrap">
    <div id="events-grid">
      <!-- Populated by Sanity -->
    </div>
  </div>

  <div class="events-footer">
    <a href="/events/archive/" class="archive-link">Every event →</a>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-text">© 2026 Southern Writers Guild</span>
      <img src="/assets/images/icon-peacock.png" alt="Jean-Paul, the Guild's peacock" class="footer-peacock">
    </div>
  </footer>

  <script type="module">
    import { fetchEvents, renderEventCard, showLoading, showError } from '../js/sanity.js'
    const grid = document.getElementById('events-grid')
    showLoading(grid)
    fetchEvents(9)
      .then(events => {
        if (!events || !events.length) {
          showError(grid, 'No events on the calendar right now — check back soon.')
          return
        }
        grid.innerHTML = events.map(renderEventCard).join('')
      })
      .catch(() => showError(grid, 'Events unavailable.'))
  </script>

  <script src="../js/nav.js"></script>
</body>
</html>
