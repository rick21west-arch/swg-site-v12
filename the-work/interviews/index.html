<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interviews — Southern Writers Guild</title>
  <link rel="stylesheet" href="../../css/swg.css">
</head>
<body>

  <nav class="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo-link">
        <img src="../../assets/images/swg-logo.png" alt="Southern Writers Guild" class="nav-logo">
      </a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <ul class="nav-links">
        <li><a href="/the-porch/">The Porch</a></li>
        <li><a href="/the-work/" class="active">The Work</a></li>
        <li><a href="/events/">Events</a></li>
        <li><a href="/the-house/">The House</a></li>
        <li><a href="/writers/">Writers</a></li>

        <li class="nav-join"><a href="/join/">Join</a></li>
      </ul>
    </div>
  </nav>

  <section class="hero" style="padding-bottom:var(--sp-md);">
    <div class="container">
      <span class="hero-eyebrow">The Work &nbsp;·&nbsp; Interviews</span>
      <h1 class="hero-headline" style="font-size:clamp(1.8rem,3.5vw,2.8rem);">Every interview.</h1>
      <p class="hero-sub"><span id="interviews-page-desc">The Guild in dialogue, recorded and hosted on our YouTube channel.</span> <a href="/the-work/" class="btn btn--ghost" style="font-size:0.62rem;margin-left:1rem;">← Back to The Work</a></p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="grid grid--3" id="interviews-archive-grid"></div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-text">© 2026 Southern Writers Guild</span>
      <img src="/assets/images/icon-peacock.png" alt="Jean-Paul, the Guild's peacock" class="footer-peacock">
    </div>
  </footer>

  <script type="module">
    import { fetchAllInterviews, renderVideoCard, showLoading, showError, fetchSitePageCopy } from '../../js/sanity.js'
    const grid = document.getElementById('interviews-archive-grid')
    showLoading(grid)
    fetchAllInterviews()
      .then(interviews => {
        if (!interviews || !interviews.length) { showError(grid, 'Interviews unavailable.'); return }
        grid.innerHTML = interviews.map(v => renderVideoCard(v, 'large')).join('')
      })
      .catch(() => showError(grid, 'Interviews unavailable.'))

    // Same mechanism as every other preview-aware page — see
    // the-porch/story/index.html for the full explanation.
    function isPreviewing() {
      return document.cookie.split('; ').some(c => c.indexOf('swg_preview_active=') === 0)
    }

    function fetchCopy() {
      if (!isPreviewing()) return fetchSitePageCopy()
      return fetch('/api/preview-singleton?type=sitePageCopy')
        .then(res => {
          if (!res.ok) throw new Error('Preview fetch failed')
          return res.json()
        })
        .then(data => data.result)
        .catch(() => fetchSitePageCopy())
    }

    fetchCopy()
      .then(copy => {
        if (!copy) return
        const descEl = document.getElementById('interviews-page-desc')
        if (descEl && copy.interviewsPageDesc) descEl.textContent = copy.interviewsPageDesc
      })
      .catch(() => {})
  </script>

  <script src="../../js/nav.js"></script>
</body>
</html>
