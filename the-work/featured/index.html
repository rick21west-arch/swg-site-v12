<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookshelf — Southern Writers Guild</title>
  <link rel="stylesheet" href="../../css/swg.css">
  <style>
    /* Same visual treatment as the-porch/index.html's own archive link —
       kept here rather than in swg.css since it's page-local there too. */
    .archive-link {
      font-size: 14px;
      color: var(--accent);
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s;
      white-space: nowrap;
    }
    .archive-link:hover { color: var(--accent-light); }
  </style>
</head>
<body>

  <nav class="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo-link">
        <img src="../../assets/images/swg-logo.png" alt="Southern Writers Guild" class="nav-logo">
      </a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <ul class="nav-links">
        <li><a href="/the-porch/">The Porch</a></li>
        <li><a href="/the-work/" class="active">The Work</a></li>
        <li><a href="/events/">Events</a></li>
        <li><a href="/the-house/">The House</a></li>
        <li><a href="/writers/">Writers</a></li>
        
        <li class="nav-join"><a href="/join/">Join</a></li>
      </ul>
    </div>
  </nav>

  <section class="hero" style="padding-bottom:var(--sp-md);">
    <div class="container">
      <span class="hero-eyebrow">The Work &nbsp;·&nbsp; Bookshelf</span>
      <h1 class="hero-headline" style="font-size:clamp(1.8rem,3.5vw,2.8rem);">The Bookshelf.</h1>
      <p class="hero-sub"><span id="bookshelf-page-desc">The Guild's currently featured writers. The feature rotates monthly and opens to outside writers.</span> <a href="/the-work/" class="btn btn--ghost" style="font-size:0.62rem;margin-left:1rem;">← Back to The Work</a></p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div style="text-align:right;margin-bottom:1rem;">
        <a href="/the-work/featured/archive/" class="archive-link">See the full Bookshelf archive →</a>
      </div>
      <div class="grid grid--3" id="featured-fiction-grid"></div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-text">© 2026 Southern Writers Guild</span>
      <img src="/assets/images/icon-peacock.png" alt="Jean-Paul, the Guild's peacock" class="footer-peacock">
    </div>
  </footer>

  <script type="module">
    import { fetchFeaturedBooks, renderBookCard, showLoading, showError, stegaClean, fetchSitePageCopy } from '../../js/sanity.js'
    const grid = document.getElementById('featured-fiction-grid')
    const dashedCard = `
      <div class="card card--dim" style="border-style:dashed;display:flex;align-items:center;justify-content:center;min-height:300px;">
        <div style="text-align:center;">
          <span class="card-label">Open to Southern writers</span>
          <p class="card-body" style="font-size:0.9rem;margin-top:0.5rem;">Future features added as the Guild grows.</p>
          <a href="/the-house/#submit" class="btn btn--ghost" style="margin-top:1rem;font-size:0.6rem;">Submit your work →</a>
        </div>
      </div>`

    // swg_preview_active is a non-secret hint cookie set by /api/preview —
    // its only job is telling the page whether to attempt the draft route.
    // The real credential is a separate HttpOnly cookie this script can't
    // read; /api/preview-featured checks that one server-side. A visitor
    // with no cookies at all never calls the preview route. Same mechanism
    // as the Porch story page — featuredFiction has no slug/individual
    // page, so this whole listing page is the click-to-edit surface.
    function isPreviewing() {
      return document.cookie.split('; ').some(c => c.indexOf('swg_preview_active=') === 0)
    }

    function fetchFeaturedFictionView() {
      if (!isPreviewing()) return fetchFeaturedBooks(9)
      return fetch('/api/preview-featured?view=main')
        .then(res => {
          if (!res.ok) throw new Error('Preview fetch failed')
          return res.json()
        })
        .then(data => data.result)
        .catch(() => fetchFeaturedBooks(9))
    }

    // renderBookCard() is a shared renderer (js/sanity.js) used by pages
    // that never preview drafts, so stegaClean() is deliberately not called
    // inside it — doing that once pulled the stega decode runtime into the
    // shared bundle chunk every page on the site loads. Instead, only this
    // page (which actually renders preview/stega-encoded data) cleans the
    // element attributes stega must never reach (img src/alt, outbound
    // hrefs) after rendering, on the joined HTML string. No-op when the
    // data isn't stega-encoded, so this has no effect outside preview mode.
    function cleanCardAttributes(html) {
      return html.replace(/(src|href|alt)="([^"]*)"/g, (m, attr, value) => `${attr}="${stegaClean(value)}"`)
    }

    showLoading(grid)
    fetchFeaturedFictionView()
      .then(features => {
        if (!features || !features.length) { grid.innerHTML = dashedCard; return }
        const cardsHtml = features.map(b => renderBookCard(b, { linkToPage: true })).join('')
        grid.innerHTML = (isPreviewing() ? cleanCardAttributes(cardsHtml) : cardsHtml) + dashedCard
      })
      .catch(() => showError(grid, 'Bookshelf unavailable.'))

    function fetchCopy() {
      if (!isPreviewing()) return fetchSitePageCopy()
      return fetch('/api/preview-singleton?type=sitePageCopy')
        .then(res => {
          if (!res.ok) throw new Error('Preview fetch failed')
          return res.json()
        })
        .then(data => data.result)
        .catch(() => fetchSitePageCopy())
    }

    fetchCopy()
      .then(copy => {
        if (!copy) return
        const descEl = document.getElementById('bookshelf-page-desc')
        if (descEl && copy.bookshelfPageDesc) descEl.textContent = copy.bookshelfPageDesc
      })
      .catch(() => {})
  </script>

  <script src="../../js/nav.js"></script>
</body>
</html>
