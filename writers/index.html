<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writers — Southern Writers Guild</title>
  <meta name="description" content="The founding writers of the Southern Writers Guild — MJ Polk, Rick West, and Gray.">
  <link rel="stylesheet" href="../css/swg.css">
  <style>
    .writers-header { padding: 48px 60px 40px; }
    .writers-eyebrow { font-size: 14px; letter-spacing: 0.22em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 14px; }
    .writers-headline { font-family: var(--serif, 'Cormorant Garamond', Georgia, serif); font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 300; color: var(--text); line-height: 1.25; }
    .writers-headline em { color: var(--accent); font-style: italic; }

    .writer-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .char-col { display: flex; align-items: center; justify-content: center; padding: 40px 20px; position: relative; }
    .char-photo-wrap { width: 280px; height: 280px; border-radius: 50%; overflow: hidden; border: 2px solid var(--accent); box-shadow: 0 0 0 8px var(--bg), 0 0 0 9px var(--border); flex-shrink: 0; }
    .char-photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .image-left .char-photo-wrap { transform: translateX(-24px); }
    .image-right .char-col { order: 2; }
    .image-right .char-photo-wrap { transform: translateX(24px); }
    .image-right .writer-col { order: 1; }
    .writer-text { padding: 32px 36px; display: flex; flex-direction: column; justify-content: center; }

    .role-label { font-size: 14px; letter-spacing: 0.2em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
    .char-name { font-family: var(--serif, Georgia, serif); font-size: 1.4rem; font-weight: 400; color: var(--text); line-height: 1.2; margin-bottom: 8px; }
    .char-descriptor { font-family: var(--serif, Georgia, serif); font-size: 0.82rem; font-style: italic; color: var(--text-muted); line-height: 1.55; }
    .identity-rule { width: 24px; height: 1px; background: var(--accent); opacity: 0.4; margin: 16px 0; }
    .writer-avatar { position: absolute; width: 56px; height: 56px; border-radius: 50%; overflow: hidden; border: 1px solid var(--border); background: var(--bg); bottom: 24px; }
    .image-left .writer-avatar { right: calc(50% - 130px); }
    .image-right .writer-avatar { left: calc(50% - 130px); }
    .writer-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
    .writer-name { font-family: var(--serif, Georgia, serif); font-size: 0.95rem; font-weight: 400; color: var(--accent-warm); margin-bottom: 10px; }
    .writer-bio { font-size: 14px; color: var(--text-muted); line-height: 1.7; font-weight: 400; margin-bottom: 16px; }
    .writer-bio p { margin-bottom: 0.85em; }
    .writer-bio p:last-child { margin-bottom: 0; }
    .writer-link { font-size: 14px; letter-spacing: 0.12em; color: var(--accent); text-decoration: none; text-transform: uppercase; transition: color 0.2s; margin-right: 1rem; display: inline-block; }
    .writer-link:hover { color: var(--accent-light); }

    .section-trio {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .trio-text-left { padding: 32px 28px; display: flex; flex-direction: column; justify-content: center; border-right: 1px solid var(--border); }
    .trio-photo { overflow: hidden; border-right: 1px solid var(--border); }
    .trio-photo img { width: 100%; height: 360px; object-fit: cover; object-position: center center; display: block; }
    .trio-text-right { padding: 32px 28px; display: flex; flex-direction: column; justify-content: center; }
    .trio-eyebrow { font-size: 14px; letter-spacing: 0.2em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; }
    .trio-headline { font-family: var(--serif, Georgia, serif); font-size: 1.3rem; font-weight: 400; color: var(--text); margin-bottom: 10px; line-height: 1.3; }

    .section-jp {
      display: grid;
      grid-template-columns: 2fr 1fr;
      border-top: 1px solid var(--border);
      align-items: center;
    }
    .jp-text { padding: 32px 40px; }
    .jp-photo-col { padding: 24px; display: flex; justify-content: center; align-items: center; }
    .jp-photo-wrap { width: 100%; max-width: 260px; overflow: hidden; border: 1px solid var(--border); border-radius: 2px; }
    .jp-photo-wrap img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
    .jp-eyebrow { font-size: 14px; letter-spacing: 0.2em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
    .jp-name { font-family: var(--serif, Georgia, serif); font-size: 1.1rem; font-weight: 400; color: var(--text); margin-bottom: 8px; }

    @media (max-width: 768px) {
      .writers-header { padding: 36px 24px 28px; }
      .writer-section { grid-template-columns: 1fr; }
      .image-right .char-col { order: 1; }
      .image-right .writer-col { order: 2; }
      .char-photo-wrap { width: 220px; height: 220px; }
      .image-left .char-photo-wrap, .image-right .char-photo-wrap { transform: none; }
      .image-left .writer-avatar, .image-right .writer-avatar { left: calc(50% - 100px); right: auto; }
      .writer-text { padding: 24px; }
      .section-trio { grid-template-columns: 1fr; }
      .trio-text-left, .trio-text-right { padding: 24px; border-right: none; }
      .trio-text-left { border-bottom: 1px solid var(--border); }
      .trio-photo { border-right: none; border-bottom: 1px solid var(--border); }
      .trio-photo img { height: 260px; }
      .section-jp { grid-template-columns: 1fr; }
      .jp-text { padding: 24px; }
      .jp-photo-col { padding: 0 24px 24px; justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo-link"><img src="../assets/images/swg-logo.png" alt="Southern Writers Guild" class="nav-logo"></a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <ul class="nav-links">
        <li><a href="/the-porch/">The Porch</a></li>
        <li><a href="/the-work/">The Work</a></li>
        <li><a href="/events/">Events</a></li>
        <li><a href="/the-house/">The House</a></li>
        <li><a href="/writers/" class="active">Writers</a></li>
        <li class="nav-join"><a href="/join/">Join</a></li>
      </ul>
    </div>
  </nav>

  <div class="writers-header">
    <p class="writers-eyebrow" id="writers-eyebrow-founders">The Founders</p>
    <h1 class="writers-headline">Three writers.<br>Three perspectives.<br><em>Infinite possibilities.</em></h1>
  </div>

  <div id="writers-list">
    <div style="padding:48px 60px;color:var(--text-faint);font-family:var(--font-ui);font-size:0.75rem;letter-spacing:0.1em;text-align:center;">Loading…</div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-text">© 2026 Southern Writers Guild</span>
      <img src="/assets/images/icon-peacock.png" alt="Jean-Paul, the Guild's peacock" class="footer-peacock">
    </div>
  </footer>

  <script type="module">
    import { fetchWriters, esc, stegaClean, sanityImageDataAttr, fetchWritersPageSettings } from '../js/sanity.js'

    const listEl = document.getElementById('writers-list')

    // Same mechanism as every other preview-aware page this session — see
    // the-work/featured/index.html for the full explanation.
    function isPreviewing() {
      return document.cookie.split('; ').some(c => c.indexOf('swg_preview_active=') === 0)
    }

    function fetchWritersView() {
      if (!isPreviewing()) return fetchWriters()
      return fetch('/api/preview-writers')
        .then(res => {
          if (!res.ok) throw new Error('Preview fetch failed')
          return res.json()
        })
        .then(data => data.result)
        .catch(() => fetchWriters())
    }

    function fetchSettingsView() {
      if (!isPreviewing()) return fetchWritersPageSettings()
      return fetch('/api/preview-singleton?type=writersPageSettings')
        .then(res => {
          if (!res.ok) throw new Error('Preview fetch failed')
          return res.json()
        })
        .then(data => data.result)
        .catch(() => fetchWritersPageSettings())
    }

    // Same attribute-safety pattern used everywhere else this session —
    // stega must never reach an element attribute (img src/alt, hrefs).
    function cleanCardAttributes(html) {
      return html.replace(/(src|href|alt)="([^"]*)"/g, (m, attr, value) => `${attr}="${stegaClean(value)}"`)
    }

    function photoPosition(hotspot) {
      if (hotspot && typeof hotspot.x === 'number' && typeof hotspot.y === 'number') {
        return `${(hotspot.x * 100).toFixed(1)}% ${(hotspot.y * 100).toFixed(1)}%`
      }
      return 'center top'
    }

    // Multi-paragraph bios were written as separate <p> tags on the old
    // hardcoded pages — preserved here rather than collapsing to one
    // block, since these bios read that way on purpose.
    function renderParagraphs(text) {
      if (!text) return ''
      return text.split(/\n\s*\n/).map(p => `<p>${esc(p.trim())}</p>`).join('')
    }

    function renderLinks(links) {
      if (!links || !links.length) return ''
      return links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener" class="writer-link">${esc(l.label)}</a>`).join('')
    }

    // Paired treatment (circular character photo + small real-person
    // avatar) for any writer with an avatar photo set. alignLeft
    // alternates strictly by position among paired writers, independent
    // of who occupies which slot, so reordering in Studio just works.
    function renderPairedSection(w, alignLeft, labels) {
      const pos = photoPosition(w.characterPhotoHotspot)
      const href = `/writers/${esc(w.slug)}/`
      const photo = `
        <div class="char-col">
          <a href="${href}" class="char-photo-wrap" style="display:block;">
            <img src="${esc(w.characterPhotoUrl || '')}" alt="${esc(w.characterName)}" data-sanity="${esc(sanityImageDataAttr(w, 'writer', 'characterPhoto'))}" style="object-position:${pos};">
          </a>
          <div class="writer-avatar"><img src="${esc(w.avatarPhotoUrl || '')}" alt="${esc(w.realName || '')}" data-sanity="${esc(sanityImageDataAttr(w, 'writer', 'avatarPhoto'))}"></div>
        </div>`
      const text = `
        <div class="writer-col">
          <div class="writer-text">
            <p class="role-label">${esc(labels.cardLabelCharacter)}</p>
            <h2 class="char-name"><a href="${href}" style="color:inherit;text-decoration:none;">${esc(w.characterName)}</a></h2>
            ${w.characterDescriptor ? `<p class="char-descriptor">${esc(w.characterDescriptor)}</p>` : ''}
            <div class="identity-rule"></div>
            <p class="role-label">${esc(labels.cardLabelWriter)}</p>
            <h3 class="writer-name">${esc(w.realName || '')}</h3>
            <div class="writer-bio">${renderParagraphs(w.writerBio)}</div>
            ${renderLinks(w.links)}
          </div>
        </div>`
      return `<div class="writer-section ${alignLeft ? 'image-left' : 'image-right'}">${alignLeft ? photo + text : text + photo}</div>`
    }

    // Character-only treatment (no avatar photo) — Jean-Paul today, any
    // future character-only entry automatically.
    function renderCharacterOnlySection(w, labels) {
      const href = `/writers/${esc(w.slug)}/`
      return `
        <div class="section-jp">
          <div class="jp-text">
            <p class="jp-eyebrow">${esc(labels.labelAlsoPresent)}</p>
            <h3 class="jp-name"><a href="${href}" style="color:inherit;text-decoration:none;">${esc(w.characterName)}</a></h3>
            <div class="identity-rule"></div>
            <div class="writer-bio" style="max-width:520px;">${renderParagraphs(w.writerBio)}</div>
            ${renderLinks(w.links)}
          </div>
          <div class="jp-photo-col">
            <a href="${href}" class="jp-photo-wrap" style="display:block;">
              <img src="${esc(w.characterPhotoUrl || '')}" alt="${esc(w.characterName)}" data-sanity="${esc(sanityImageDataAttr(w, 'writer', 'characterPhoto'))}">
            </a>
          </div>
        </div>`
    }

    // Fixed defaults match the real live copy — used if writersPageSettings
    // hasn't loaded yet or a field is unset, same fallback philosophy as
    // every other Sanity-fetched field on this site.
    const TRIO_DEFAULTS = {
      eyebrowTrio: 'The Trio',
      trioHeading: 'On the\nPorch steps.',
      trioImageUrl: '../assets/images/char-trio.jpg',
      trioImageAlt: 'Hank, Grace, and Beau on the Porch steps',
      trioDescription: 'Hank, Grace, and Beau — the characters who showed up first and never really left. They\'re the reason The Porch exists. Everything else grew from that.'
    }

    function renderTrioSection(settings) {
      const s = Object.assign({}, TRIO_DEFAULTS, settings ? {
        eyebrowTrio: settings.eyebrowTrio || TRIO_DEFAULTS.eyebrowTrio,
        trioHeading: settings.trioHeading || TRIO_DEFAULTS.trioHeading,
        trioImageUrl: settings.trioImageUrl || TRIO_DEFAULTS.trioImageUrl,
        trioImageAlt: (settings.trioImage && settings.trioImage.alt) || TRIO_DEFAULTS.trioImageAlt,
        trioDescription: settings.trioDescription || TRIO_DEFAULTS.trioDescription
      } : {})
      const headingHtml = s.trioHeading.split('\n').map(esc).join('<br>')
      return `
      <div class="section-trio">
        <div class="trio-text-left">
          <p class="trio-eyebrow">${esc(s.eyebrowTrio)}</p>
          <h2 class="trio-headline">${headingHtml}</h2>
          <div class="identity-rule"></div>
        </div>
        <div class="trio-photo">
          <img src="${esc(s.trioImageUrl)}" alt="${esc(s.trioImageAlt)}">
        </div>
        <div class="trio-text-right">
          <p class="writer-bio">${esc(s.trioDescription)}</p>
        </div>
      </div>`
    }

    const LABEL_DEFAULTS = {
      cardLabelCharacter: 'The Character',
      cardLabelWriter: 'The Writer',
      labelAlsoPresent: 'Also Present'
    }

    Promise.all([fetchWritersView(), fetchSettingsView().catch(() => null)])
      .then(([writers, settings]) => {
        if (!writers || !writers.length) {
          listEl.innerHTML = '<div style="padding:48px 60px;color:var(--text-faint);font-family:var(--font-ui);font-size:0.75rem;text-align:center;">No writers found.</div>'
          return
        }
        const labels = Object.assign({}, LABEL_DEFAULTS, settings ? {
          cardLabelCharacter: settings.cardLabelCharacter || LABEL_DEFAULTS.cardLabelCharacter,
          cardLabelWriter: settings.cardLabelWriter || LABEL_DEFAULTS.cardLabelWriter,
          labelAlsoPresent: settings.labelAlsoPresent || LABEL_DEFAULTS.labelAlsoPresent
        } : {})
        const trioSection = renderTrioSection(settings)
        let pairedIndex = 0
        let trioInserted = false
        const parts = []
        writers.forEach(w => {
          if (w.avatarPhotoUrl) {
            parts.push(renderPairedSection(w, pairedIndex % 2 === 0, labels))
            pairedIndex++
          } else {
            if (!trioInserted) { parts.push(trioSection); trioInserted = true }
            parts.push(renderCharacterOnlySection(w, labels))
          }
        })
        if (!trioInserted) parts.push(trioSection)
        const html = parts.join('')
        listEl.innerHTML = isPreviewing() ? cleanCardAttributes(html) : html

        const eyebrowEl = document.getElementById('writers-eyebrow-founders')
        if (eyebrowEl && settings && settings.eyebrowFounders) eyebrowEl.textContent = settings.eyebrowFounders
        if (settings && settings.writersMetaDescription) {
          const meta = document.querySelector('meta[name="description"]')
          if (meta) meta.setAttribute('content', settings.writersMetaDescription)
        }
      })
      .catch(() => {
        listEl.innerHTML = '<div style="padding:48px 60px;color:var(--text-faint);font-family:var(--font-ui);font-size:0.75rem;text-align:center;">Writers unavailable.</div>'
      })
  </script>

  <script src="../js/nav.js"></script>
</body>
</html>
