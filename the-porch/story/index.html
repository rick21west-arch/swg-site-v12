<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Porch — Southern Writers Guild</title>
  <link rel="stylesheet" href="/css/swg.css">
</head>
<body>

  <nav class="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo-link">
        <img src="/assets/images/swg-logo.png" alt="Southern Writers Guild" class="nav-logo">
      </a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <ul class="nav-links">
        <li><a href="/the-porch/" class="active">The Porch</a></li>
        <li><a href="/the-work/">The Work</a></li>
        <li><a href="/events/">Events</a></li>
        <li><a href="/the-house/">The House</a></li>
        <li><a href="/writers/">Writers</a></li>
        <li class="nav-join"><a href="/join/">Join</a></li>
      </ul>
    </div>
  </nav>

  <section class="hero" style="padding-bottom:var(--sp-sm);">
    <div class="container" style="max-width:var(--content-w);">
      <span class="hero-eyebrow">The Porch</span>
      <h1 id="story-title" class="hero-headline" style="font-size:clamp(1.8rem,3.5vw,2.6rem);">Loading…</h1>
      <p id="story-meta" class="hero-sub" style="font-family:var(--font-ui);font-size:0.8rem;letter-spacing:0.04em;"></p>
    </div>
  </section>

  <section class="section">
    <div class="container" style="max-width:var(--content-w);">
      <div id="story-thumb"></div>
      <div id="story-body" class="prose"></div>
      <div id="story-fallback"></div>
      <p style="margin-top:var(--sp-lg);">
        <a href="/the-porch/" style="font-size:14px;color:var(--accent);letter-spacing:0.12em;text-decoration:none;text-transform:uppercase;">← Back to the Porch</a>
      </p>
    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-text">© 2026 Southern Writers Guild</span>
      <img src="/assets/images/icon-peacock.png" alt="Jean-Paul, the Guild's peacock" class="footer-peacock">
    </div>
  </footer>

  <script type="module">
    import { fetchPorchStoryBySlug, renderPortableText, thumbSrc, stegaClean } from '/js/sanity.js'

    const titleEl = document.getElementById('story-title')
    const metaEl = document.getElementById('story-meta')
    const thumbEl = document.getElementById('story-thumb')
    const bodyEl = document.getElementById('story-body')
    const fallbackEl = document.getElementById('story-fallback')

    const parts = window.location.pathname.split('/').filter(Boolean)
    const slug = parts[parts.length - 1]

    function esc(str) {
      const d = document.createElement('div')
      d.textContent = str || ''
      return d.innerHTML
    }

    function formatDate(dateStr) {
      if (!dateStr) return ''
      const d = new Date(dateStr + 'T12:00:00Z')
      return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })
    }

    function notFound() {
      titleEl.textContent = 'Story not found'
      metaEl.textContent = ''
      bodyEl.innerHTML = '<p>We couldn’t find that story. It may have moved.</p>'
    }

    // swg_preview_active is a non-secret hint cookie set by /api/preview —
    // its only job is telling the page whether to attempt the draft route.
    // The real credential is a separate HttpOnly cookie this script can't
    // read; /api/preview-story checks that one server-side. A visitor with
    // no cookies at all never calls the preview route, so this is additive
    // to the existing published-only fetch, not a change to it.
    function isPreviewing() {
      return document.cookie.split('; ').some(c => c.indexOf('swg_preview_active=') === 0)
    }

    // TEMPORARY diagnostic — root-causing the "Unable to connect" banner in
    // Presentation Tool (2026-08-29). Reports this page's own cookie state
    // back to the server so it shows up in Vercel logs. Remove once resolved.
    fetch(`/api/preview-debug?cookies=${encodeURIComponent(document.cookie)}&isPreviewing=${isPreviewing()}&href=${encodeURIComponent(location.href)}&referrer=${encodeURIComponent(document.referrer)}`).catch(() => {})

    function fetchStory(slug) {
      if (!isPreviewing()) return fetchPorchStoryBySlug(slug)
      return fetch(`/api/preview-story?slug=${encodeURIComponent(slug)}`)
        .then(res => {
          if (!res.ok) throw new Error('Preview fetch failed')
          return res.json()
        })
        .then(data => data.result)
        .catch(() => fetchPorchStoryBySlug(slug))
    }

    function renderStory(story) {
      if (!story) { notFound(); return }

      // document.title and the img alt attribute are both places stega's
      // invisible edit-metadata characters cause real bugs (Sanity's own
      // guidance: never let stega reach <head> or an element attribute) —
      // stegaClean() strips them; it's a no-op on the non-preview path
      // where story.title was never encoded in the first place. The
      // visible on-page heading (titleEl) is left un-cleaned on purpose:
      // that's the actual click-to-edit target for the title field.
      document.title = `${stegaClean(story.title)} — The Porch — Southern Writers Guild`
      titleEl.textContent = story.title
      metaEl.textContent = [formatDate(story.publishedAt), story.authors].filter(Boolean).join('  ·  ')

      const thumb = thumbSrc(story, 1200)
      if (thumb) {
        thumbEl.innerHTML = `<img src="${esc(thumb)}" alt="${esc(stegaClean(story.title))}" style="width:100%;height:auto;display:block;margin:var(--sp-md) 0;">`
      }

      if (story.body && story.body.length) {
        bodyEl.innerHTML = renderPortableText(story.body)
      } else if (story.excerpt) {
        bodyEl.innerHTML = `<p>${esc(story.excerpt)}</p>`
      }

      if (story.substackUrl) {
        fallbackEl.innerHTML = `<p style="margin-top:var(--sp-md);"><a href="${esc(story.substackUrl)}" target="_blank" rel="noopener" class="btn btn--ghost">Read on Substack →</a></p>`
      }
    }

    function loadStory(slug) {
      return fetchStory(slug)
        .then(renderStory)
        .catch(() => {
          titleEl.textContent = 'Story unavailable'
          metaEl.textContent = ''
          bodyEl.innerHTML = '<p>Something went wrong loading this story.</p>'
        })
    }

    if (!slug) {
      notFound()
    } else {
      loadStory(slug)

      // Click-to-edit overlay — dynamically imported so its code is never
      // fetched by a normal visitor's browser at all, not just unused.
      // enableVisualEditing() itself tells the two click contexts apart:
      // inside Presentation Tool's iframe it jumps the Studio panel to the
      // field over its Comlink connection; opened as a bare link outside
      // Presentation Tool, a click builds a Studio URL from the studioUrl
      // baked into the story's stega payload (set server-side in
      // api/preview-story.js) and opens it in a new tab.
      if (isPreviewing()) {
        import('@sanity/visual-editing').then(({ enableVisualEditing }) => {
          enableVisualEditing({
            history: {
              subscribe: (navigate) => {
                const handler = () => navigate({ type: 'pop', url: location.href })
                addEventListener('popstate', handler)
                return () => removeEventListener('popstate', handler)
              },
              update: (update) => {
                if (update.type === 'push') history.pushState(null, '', update.url)
                if (update.type === 'replace') history.replaceState(null, '', update.url)
              },
            },
            refresh: async (payload) => {
              if (payload.source === 'mutation') {
                await loadStory(slug)
              }
            },
          })
        })
      }
    }
  </script>

  <script src="/js/nav.js"></script>
</body>
</html>
